services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: earthwise_backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DJANGO_SECRET_KEY=your-secret-key
      - DATABASE_URL=sqlite:///db.sqlite3
    volumes:
      - ./backend:/app/backend
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: earthwise_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: earthwise_db
    environment:
      POSTGRES_DB: earthwise
      POSTGRES_USER: earthwise_user
      POSTGRES_PASSWORD: yourpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
